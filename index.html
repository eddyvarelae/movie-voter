<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Night — Submit &amp; Vote</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>">
<style>
  :root {
    --bg: #f6f5fb;
    --card: #ffffff;
    --ink: #1f2033;
    --muted: #6b6d85;
    --accent: #6d5bd0;
    --accent-soft: #efecfb;
    --border: #e4e2f0;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(31, 32, 51, 0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: linear-gradient(120deg, #4f46e5, #7c3aed, #db2777);
    color: #fff;
    padding: 40px 20px 48px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -0.02em; }
  header p { margin: 0 auto; max-width: 520px; opacity: 0.9; line-height: 1.5; }
  main { max-width: 860px; margin: -24px auto 60px; padding: 0 16px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 1.05rem; }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
  input[type=text] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: #fbfaff;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 220px; }
  button {
    font: inherit;
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    margin-top: 14px;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.55; cursor: default; filter: none; }
  .banner {
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 0.9rem;
    display: none;
  }
  .banner.info { display: block; background: var(--accent-soft); color: var(--accent); }
  .banner.error { display: block; background: #fdecec; color: #b3261e; }
  .list-head { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; }
  .list-head h2 { margin: 0; font-size: 1.15rem; }
  .list-head button { margin: 0; padding: 6px 12px; background: var(--accent-soft); color: var(--accent); font-size: 0.85rem; }
  .movie {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .votebox { text-align: center; min-width: 76px; }
  .votebox .count { font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .votebox .unit { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .votebox button { margin-top: 8px; padding: 7px 14px; font-size: 0.85rem; width: 100%; }
  .votebox button.voted { background: #e8f6ee; color: #1a7f4b; }
  .votebox button.voted:not(:disabled):hover { background: #fdecec; color: #b3261e; filter: none; }
  .movie h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .editbtn { margin: 0 0 0 8px; padding: 2px 8px; font-size: 0.72rem; background: var(--accent-soft); color: var(--accent); border-radius: 6px; }
  .editform button { margin-right: 8px; }
  .editform .cancel { background: var(--accent-soft); color: var(--accent); }
  .meta { font-size: 0.82rem; color: var(--muted); }
  .note { margin: 8px 0 0; font-size: 0.9rem; line-height: 1.45; }
  .voters { margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
  .voters span { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 9px; margin: 0 4px 4px 0; display: inline-block; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .movie.openable { cursor: pointer; }
  .movie.openable:hover { border-color: var(--accent); }
  .openhint { font-size: 0.72rem; color: var(--accent); margin-top: 8px; }
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(31, 32, 51, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(31, 32, 51, 0.35);
    display: flex; gap: 0;
    max-width: 720px; width: 100%; max-height: 90vh;
    overflow: hidden; position: relative;
  }
  .modal img.poster { width: 46%; object-fit: cover; display: block; }
  .modal .intro { padding: 24px 24px 20px; overflow-y: auto; flex: 1; }
  .modal .intro img.face { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; display: block; margin-bottom: 10px; }
  .modal .intro h3 { margin: 0 0 2px; font-size: 1.2rem; }
  .modal .intro .who { font-size: 0.82rem; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
  .modal .intro .role { font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; }
  .modal .intro p { font-size: 0.9rem; line-height: 1.55; margin: 0 0 10px; }
  .modal .close {
    position: absolute; top: 10px; right: 10px; margin: 0;
    background: rgba(31, 32, 51, 0.45); color: #fff;
    border-radius: 50%; width: 32px; height: 32px; padding: 0;
    font-size: 1rem; line-height: 1;
  }
  @media (max-width: 560px) {
    .modal { flex-direction: column; overflow-y: auto; }
    .modal img.poster { width: 100%; max-height: 48vh; }
  }
  @media (max-width: 560px) {
    header h1 { font-size: 1.6rem; }
    .movie { flex-direction: column-reverse; }
    .votebox { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .votebox button { margin-top: 0; width: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>🍿 Movie Night</h1>
  <p>Suggest a movie and vote for the ones you want to watch. Just leave your name — no accounts, we trust each other.</p>
</header>

<main>
  <div class="panel">
    <label for="f-name">Your name</label>
    <input type="text" id="f-name" placeholder="Who are you?" maxlength="60" autocomplete="name">
  </div>

  <div class="panel">
    <h2>Suggest a movie</h2>
    <div class="row">
      <div>
        <label for="f-title">Movie title</label>
        <input type="text" id="f-title" placeholder="e.g. The Grand Budapest Hotel" maxlength="120">
      </div>
      <div>
        <label for="f-note">Why this one? <span style="font-weight:400">(optional)</span></label>
        <input type="text" id="f-note" placeholder="Sell it in one line" maxlength="200">
      </div>
    </div>
    <button id="btn-submit">Add movie</button>
  </div>

  <div id="banner" class="banner"></div>

  <div class="list-head">
    <h2>The ballot</h2>
    <button id="btn-refresh">↻ Refresh</button>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>

<script>
// Movies and votes live in Airtable. The token is public by design (it is
// scoped to create/read on this one base); secrets just keep it out of git.
const AIRTABLE = {
  token: "PASTE_AIRTABLE_TOKEN",
  baseId: "PASTE_BASE_ID",
  moviesTable: "tbl8OcKyX0hVgcfYL", // "movies" — table id survives renames
  votesTable: "tblN0fE3sFl68uNYU"   // "votes"
};
const DEMO = AIRTABLE.token.startsWith("PASTE_");

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Remember the name and which movies this browser already voted for.
// Purely a courtesy — nothing is enforced. We keep the Airtable record id of
// each vote so the same machine can unvote (delete that exact record).
$("f-name").value = localStorage.getItem("mv_name") || "";
$("f-name").addEventListener("change", () => localStorage.setItem("mv_name", $("f-name").value.trim()));
const votedRec = JSON.parse(localStorage.getItem("mv_votes") || "{}"); // movieId -> vote record id
// legacy format (pre-unvote): array of movieIds with no record id — voted, but not removable
JSON.parse(localStorage.getItem("mv_voted") || "[]").forEach(id => { if (!(id in votedRec)) votedRec[id] = null; });
function saveVotes() { localStorage.setItem("mv_votes", JSON.stringify(votedRec)); }
const mine = JSON.parse(localStorage.getItem("mv_mine") || "{}"); // movieId -> true (submitted from this machine)
function saveMine() { localStorage.setItem("mv_mine", JSON.stringify(mine)); }
let editingId = null;
const TITLE_EDIT_WINDOW_MS = 60000;
const canEditTitle = m => (Date.now() - new Date(m.createdTime).getTime()) < TITLE_EDIT_WINDOW_MS;

let movies = [];            // [{id, title, submittedBy, note, createdTime}]
let votesByMovie = {};      // movieId -> [voterName]

// Per-movie extras shown when a card is opened: poster + an intro from the
// person who suggested it. Keyed by lowercased title so it survives record
// re-creation; assets live in ./assets and deploy with the page.
const EXTRAS = {
  "howl's moving castle": {
    poster: "assets/howls-poster.jpg",
    intro: {
      photo: "assets/marianna.png",
      name: "Marianna",
      role: "Copywriter & Email Specialist · Galicia, Spain 🇪🇸 · from Greece 🇬🇷",
      text: "Every Leangap email you've received? She wrote it. Getting people to click and say yes is literally her job — and tonight she says yes to Howl. A wizard's walking castle, a cursed hat-maker, and the most romantic anti-war film Ghibli ever made.\n\nOff the clock you'll find her rolling dice in DnD 🐉, cuddling her cat Capitan, and deep in romantasy — so yes, she has strong feelings about Howl's hair."
    }
  }
};
const extrasFor = m => EXTRAS[(m.title || "").trim().toLowerCase()];

function api(table) {
  return `https://api.airtable.com/v0/${AIRTABLE.baseId}/${encodeURIComponent(table)}`;
}
const headers = {
  "Authorization": `Bearer ${AIRTABLE.token}`,
  "Content-Type": "application/json"
};

async function fetchAll(table) {
  const records = [];
  let offset = "";
  do {
    const res = await fetch(`${api(table)}?pageSize=100${offset ? "&offset=" + offset : ""}`, { headers });
    if (!res.ok) throw new Error(`Airtable ${res.status} on ${table}`);
    const data = await res.json();
    records.push(...(data.records || []));
    offset = data.offset;
  } while (offset);
  return records;
}

function banner(kind, msg) {
  const el = $("banner");
  el.className = "banner" + (kind ? " " + kind : "");
  el.textContent = msg || "";
}

async function load() {
  if (DEMO) {
    banner("info", "Demo mode — Airtable is not configured yet, so nothing is saved. Deploys inject the real credentials.");
    movies = [
      { id: "demo1", title: "The Grand Budapest Hotel", submittedBy: "Eddy", note: "Pure eye candy.", createdTime: "2026-01-01" },
      { id: "demo2", title: "Howl's moving castle", submittedBy: "Marianna", note: "", createdTime: "2026-01-02" }
    ];
    votesByMovie = { demo1: ["Ana", "Leo"], demo2: ["Eddy", "Marianna"] };
    render();
    return;
  }
  try {
    const [movieRecs, voteRecs] = await Promise.all([
      fetchAll(AIRTABLE.moviesTable),
      fetchAll(AIRTABLE.votesTable)
    ]);
    movies = movieRecs.map(r => ({
      id: r.id,
      title: r.fields["title"] || "(untitled)",
      submittedBy: r.fields["submittedBy"] || "anonymous",
      note: r.fields["note"] || "",
      createdTime: r.createdTime
    }));
    votesByMovie = {};
    voteRecs.forEach(r => {
      const mid = r.fields["movieId"];
      if (!mid) return;
      (votesByMovie[mid] = votesByMovie[mid] || []).push(r.fields["voter"] || "anonymous");
    });
    banner("", "");
    render();
  } catch (err) {
    banner("error", "Couldn't reach Airtable — check the connection and hit Refresh. (" + err.message + ")");
  }
}

function render() {
  const list = $("list");
  if (!movies.length) {
    list.innerHTML = '<div class="empty">No movies yet — be the first to suggest one!</div>';
    return;
  }
  const sorted = [...movies].sort((a, b) =>
    (votesByMovie[b.id]?.length || 0) - (votesByMovie[a.id]?.length || 0) ||
    (a.createdTime > b.createdTime ? 1 : -1));
  list.innerHTML = sorted.map(m => {
    const voters = votesByMovie[m.id] || [];
    const voted = m.id in votedRec;
    const removable = voted && votedRec[m.id]; // legacy votes have no record id, can't be undone
    let body;
    if (editingId === m.id) {
      const titleOpen = canEditTitle(m);
      body = `
        <div style="flex:1" class="editform">
          <label>Movie title${titleOpen ? "" : " (locked — editable only for 60s after submitting)"}</label>
          <input type="text" id="e-title" value="${esc(m.title)}" maxlength="120" ${titleOpen ? "" : "disabled"}>
          <label>Why this one?</label>
          <input type="text" id="e-note" value="${esc(m.note)}" maxlength="200">
          <button data-save="${esc(m.id)}">Save</button>
          <button data-cancel class="cancel">Cancel</button>
        </div>`;
    } else {
      body = `
        <div style="flex:1">
          <h3>${esc(m.title)}${mine[m.id] ? `<button class="editbtn" data-edit="${esc(m.id)}">✎ Edit</button>` : ""}</h3>
          <div class="meta">suggested by ${esc(m.submittedBy)}</div>
          ${m.note ? `<p class="note">${esc(m.note)}</p>` : ""}
          ${voters.length ? `<div class="voters">${voters.map(v => `<span>${esc(v)}</span>`).join("")}</div>` : ""}
          ${extrasFor(m) ? `<div class="openhint">▸ Open the card for the poster &amp; a word from ${esc(m.submittedBy)}</div>` : ""}
        </div>`;
    }
    return `
      <div class="movie${extrasFor(m) && editingId !== m.id ? " openable" : ""}" data-card="${esc(m.id)}">
        <div class="votebox">
          <div><div class="count">${voters.length}</div><div class="unit">vote${voters.length === 1 ? "" : "s"}</div></div>
          <button data-vote="${esc(m.id)}" class="${voted ? "voted" : ""}" ${voted && !removable ? "disabled" : ""}
            title="${voted ? (removable ? "Click to remove your vote" : "Voted on this device") : ""}">
            ${voted ? "✓ Voted" : "▲ Vote"}
          </button>
        </div>
        ${body}
      </div>`;
  }).join("");
  list.querySelectorAll("[data-vote]").forEach(btn =>
    btn.addEventListener("click", () => (btn.dataset.vote in votedRec) ? unvote(btn.dataset.vote, btn) : vote(btn.dataset.vote, btn)));
  list.querySelectorAll("[data-edit]").forEach(btn =>
    btn.addEventListener("click", () => { editingId = btn.dataset.edit; render(); }));
  list.querySelectorAll("[data-save]").forEach(btn =>
    btn.addEventListener("click", () => saveEdit(btn.dataset.save, btn)));
  list.querySelectorAll("[data-cancel]").forEach(btn =>
    btn.addEventListener("click", () => { editingId = null; render(); }));
  list.querySelectorAll(".movie.openable").forEach(card =>
    card.addEventListener("click", e => {
      if (e.target.closest("button, input, a")) return; // voting/editing, not opening
      openCard(card.dataset.card);
    }));
}

function openCard(movieId) {
  const m = movies.find(x => x.id === movieId);
  const x = m && extrasFor(m);
  if (!x) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <img class="poster" src="${esc(x.poster)}" alt="${esc(m.title)} poster">
      <div class="intro">
        <img class="face" src="${esc(x.intro.photo)}" alt="${esc(x.intro.name)}">
        <div class="who">Suggested by ${esc(x.intro.name)}</div>
        <h3>${esc(m.title)}</h3>
        <div class="role">${esc(x.intro.role)}</div>
        ${x.intro.text.split("\n\n").map(p => `<p>${esc(p)}</p>`).join("")}
      </div>
      <button class="close" aria-label="Close">✕</button>
    </div>`;
  const close = () => { overlay.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  overlay.addEventListener("click", e => { if (e.target === overlay || e.target.closest(".close")) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(overlay);
}

function requireName() {
  const name = $("f-name").value.trim();
  if (!name) {
    banner("error", "Add your name first — that's the whole honor system!");
    $("f-name").focus();
    return null;
  }
  localStorage.setItem("mv_name", name);
  return name;
}

async function submitMovie() {
  const name = requireName();
  if (!name) return;
  const title = $("f-title").value.trim();
  if (!title) { banner("error", "The movie needs a title."); $("f-title").focus(); return; }
  const note = $("f-note").value.trim();
  const btn = $("btn-submit");
  btn.disabled = true;
  try {
    if (!DEMO) {
      const res = await fetch(api(AIRTABLE.moviesTable), {
        method: "POST",
        headers,
        body: JSON.stringify({ records: [{ fields: { "title": title, "submittedBy": name, "note": note } }] })
      });
      if (!res.ok) throw new Error(`Airtable ${res.status}`);
      const data = await res.json();
      const movieId = data.records[0].id;
      mine[movieId] = true;
      saveMine();
      // Your suggestion starts with your own vote on it.
      const voteRes = await fetch(api(AIRTABLE.votesTable), {
        method: "POST",
        headers,
        body: JSON.stringify({ records: [{ fields: { "voter": name, "movieId": movieId, "movieTitle": title } }] })
      });
      if (voteRes.ok) {
        votedRec[movieId] = (await voteRes.json()).records[0].id;
        saveVotes();
      }
    }
    $("f-title").value = "";
    $("f-note").value = "";
    banner("info", `"${title}" is on the ballot, with your vote on it. 🎬`);
    await load();
  } catch (err) {
    banner("error", "Couldn't save the movie — try again. (" + err.message + ")");
  } finally {
    btn.disabled = false;
  }
}

async function vote(movieId, btn) {
  const name = requireName();
  if (!name) return;
  btn.disabled = true;
  try {
    let recId = "demo";
    if (!DEMO) {
      const movie = movies.find(m => m.id === movieId);
      const res = await fetch(api(AIRTABLE.votesTable), {
        method: "POST",
        headers,
        body: JSON.stringify({ records: [{ fields: {
          "voter": name,
          "movieId": movieId,
          "movieTitle": movie ? movie.title : ""
        } }] })
      });
      if (!res.ok) throw new Error(`Airtable ${res.status}`);
      recId = (await res.json()).records[0].id;
    }
    votedRec[movieId] = recId;
    saveVotes();
    (votesByMovie[movieId] = votesByMovie[movieId] || []).push(name);
    render();
  } catch (err) {
    btn.disabled = false;
    banner("error", "Couldn't save the vote — try again. (" + err.message + ")");
  }
}

async function unvote(movieId, btn) {
  btn.disabled = true;
  try {
    if (!DEMO) {
      const res = await fetch(`${api(AIRTABLE.votesTable)}/${votedRec[movieId]}`, { method: "DELETE", headers });
      if (!res.ok && res.status !== 404) throw new Error(`Airtable ${res.status}`); // 404: already gone, fine
    }
    delete votedRec[movieId];
    saveVotes();
    const arr = votesByMovie[movieId] || [];
    const i = arr.indexOf($("f-name").value.trim());
    if (i >= 0) arr.splice(i, 1);
    render();
    if (!DEMO) load(); // reconcile with the server in the background
  } catch (err) {
    btn.disabled = false;
    banner("error", "Couldn't remove the vote — try again. (" + err.message + ")");
  }
}

async function saveEdit(movieId, btn) {
  const m = movies.find(x => x.id === movieId);
  if (!m) return;
  const titleOpen = canEditTitle(m);
  const title = titleOpen ? $("e-title").value.trim() : m.title;
  const note = $("e-note").value.trim();
  if (!title) { banner("error", "The movie needs a title."); return; }
  btn.disabled = true;
  try {
    const fields = { "note": note };
    if (titleOpen) fields["title"] = title;
    if (!DEMO) {
      const res = await fetch(`${api(AIRTABLE.moviesTable)}/${movieId}`, {
        method: "PATCH",
        headers,
        body: JSON.stringify({ fields })
      });
      if (!res.ok) throw new Error(`Airtable ${res.status}`);
    }
    m.title = title;
    m.note = note;
    editingId = null;
    render();
  } catch (err) {
    btn.disabled = false;
    banner("error", "Couldn't save the changes — try again. (" + err.message + ")");
  }
}

$("btn-submit").addEventListener("click", submitMovie);
$("btn-refresh").addEventListener("click", load);
$("f-title").addEventListener("keydown", e => { if (e.key === "Enter") submitMovie(); });
$("f-note").addEventListener("keydown", e => { if (e.key === "Enter") submitMovie(); });

load();
setInterval(() => { if (!DEMO && editingId === null) load(); }, 60000); // keep counts fresh; don't clobber an open edit form
</script>
</body>
</html>
